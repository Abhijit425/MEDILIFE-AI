name: Build MediLife AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/MediLifeAI-v1.0.0-release.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: MediLifeAI-release-apk
          path: out/MediLifeAI-v1.0.0-release.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: MediLife AI build ${{ github.run_number }}
          files: out/MediLifeAI-v1.0.0-release.apk
          make_latest: true
